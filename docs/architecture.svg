<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">A map of ShopLedger browser UI, Express server, routers, library modules, configuration, JSON data store, and numbered order creation flow.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:24px;font-weight:700}.subtitle{font-size:13px;fill:#526075}
      .section{font-size:14px;font-weight:700;letter-spacing:.4px;fill:#334155}
      .label{font-size:13px;font-weight:700}.small{font-size:12px;fill:#475569}
      .box{fill:#fff;stroke:#b8c4d3;stroke-width:1.4}.router{fill:#f8fafc;stroke:#94a3b8;stroke-width:1.2}
      .lib{fill:#f1f5f9;stroke:#cbd5e1;stroke-width:1.1}.ticket{fill:#fff1f2;stroke:#e11d48;stroke-width:2}
      .tax{fill:#fff7ed;stroke:#ea580c;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#flowArrow)}
      .link{fill:none;stroke:#94a3b8;stroke-width:1.35;marker-end:url(#arrow)}
      .step{fill:#2563eb;stroke:#fff;stroke-width:2}.stepText{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
      .mono{font-family:Arial,Helvetica,sans-serif;font-size:12px}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f8fafc"/>
  <text x="28" y="38" class="title">ShopLedger | Architecture &amp; order flow</text>
  <text x="28" y="61" class="subtitle">Verified source map · arrows show request/data relationships · blue numbered path traces POST /api/orders</text>

  <!-- main request path -->
  <rect x="28" y="88" width="210" height="106" rx="10" class="box"/>
  <text x="44" y="113" class="section">BROWSER UI</text>
  <text x="44" y="137" class="label">public/</text>
  <text x="44" y="158" class="small">index.html · js/app.js · css/style.css</text>
  <text x="44" y="178" class="small">Cart posts to /api/orders</text>

  <rect x="285" y="88" width="210" height="106" rx="10" class="box"/>
  <text x="301" y="113" class="section">EXPRESS APP</text>
  <text x="301" y="138" class="label">server.js</text>
  <text x="301" y="159" class="small">Static public/ · JSON body parser</text>
  <text x="301" y="179" class="small">Mounts routers; invoice HTML route</text>
  <path d="M238 141 H285" class="flow"/>
  <circle cx="259" cy="141" r="12" class="step"/><text x="259" y="145" class="stepText">1</text>

  <rect x="548" y="80" width="270" height="122" rx="10" class="router"/>
  <text x="564" y="104" class="section">ROUTERS · routes/</text>
  <text x="564" y="128" class="label">orders.js</text><text x="684" y="128" class="small">POST /orders · GET · cancel</text>
  <text x="564" y="150" class="label">products.js</text><text x="684" y="150" class="small">products · coupons</text>
  <text x="564" y="172" class="label">customers.js</text><text x="684" y="172" class="small">customers · settlement</text>
  <text x="564" y="194" class="label">reports.js</text><text x="684" y="194" class="small">preview · reports · export</text>
  <path d="M495 141 H548" class="flow"/>
  <circle cx="520" cy="141" r="12" class="step"/><text x="520" y="145" class="stepText">2</text>

  <rect x="28" y="226" width="790" height="347" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="46" y="253" class="section">LIBRARY MODULES · lib/</text>
  <text x="46" y="278" class="small">Order path dependencies are emphasized in blue; invoice/tax ticket focus uses warm highlight.</text>

  <rect x="48" y="301" width="230" height="70" rx="8" class="lib"/>
  <text x="64" y="326" class="label">pricing.js</text><text x="64" y="349" class="small">subtotal · computeTotals</text>
  <rect x="305" y="301" width="230" height="70" rx="8" class="lib"/>
  <text x="321" y="326" class="label">coupons.js</text><text x="321" y="349" class="small">normalize · validate · discount</text>
  <rect x="562" y="301" width="230" height="70" rx="8" class="tax"/>
  <text x="578" y="326" class="label">tax.js</text><text x="578" y="349" class="small">HSN GST rate · CGST/SGST split</text>

  <rect x="48" y="394" width="230" height="70" rx="8" class="lib"/>
  <text x="64" y="419" class="label">inventory.js</text><text x="64" y="442" class="small">find · check · reserve · release</text>
  <rect x="305" y="394" width="230" height="70" rx="8" class="lib"/>
  <text x="321" y="419" class="label">orders.js</text><text x="321" y="442" class="small">add · get · cancel · list</text>
  <rect x="562" y="394" width="230" height="70" rx="8" class="lib"/>
  <text x="578" y="419" class="label">ledger.js</text><text x="578" y="442" class="small">Khata debit/reverse · settlement</text>

  <rect x="48" y="487" width="230" height="65" rx="8" class="ticket"/>
  <text x="64" y="512" class="label">invoice.js</text><text x="64" y="535" class="small">computeInvoiceFigures · render</text>
  <rect x="305" y="487" width="230" height="65" rx="8" class="lib"/>
  <text x="321" y="512" class="label">store.js</text><text x="321" y="535" class="small">read · write · appendAudit</text>
  <rect x="562" y="478" width="230" height="34" rx="7" class="lib"/><text x="575" y="501" class="label">reports.js</text>
  <rect x="562" y="520" width="230" height="34" rx="7" class="lib"/><text x="578" y="543" class="label">dates.js</text>

  <!-- numbered order flow into service modules and persistence -->
  <path d="M680 202 V282 H164 V301" class="flow"/>
  <circle cx="659" cy="282" r="12" class="step"/><text x="659" y="286" class="stepText">3</text>
  <path d="M278 336 H305" class="link"/>
  <path d="M278 350 C420 380 540 380 562 336" class="link"/>
  <path d="M164 371 V394" class="flow"/><circle cx="164" cy="382" r="12" class="step"/><text x="164" y="386" class="stepText">4</text>
  <path d="M278 429 H305" class="flow"/><circle cx="292" cy="429" r="12" class="step"/><text x="292" y="433" class="stepText">5</text>
  <path d="M535 429 H562" class="link"/>
  <path d="M420 464 V487" class="flow"/><circle cx="420" cy="475" r="12" class="step"/><text x="420" y="479" class="stepText">6</text>
  <path d="M420 464 C420 472 600 470 600 478" class="link"/>

  <!-- config and database -->
  <rect x="858" y="88" width="310" height="118" rx="10" class="box"/>
  <text x="878" y="116" class="section">CONFIGURATION</text>
  <text x="878" y="143" class="label">config.js</text>
  <text x="878" y="165" class="small">Shop · GST slabs/default · coupons · admin key</text>
  <path d="M818 157 H858" class="link"/>
  <path d="M818 336 C845 336 835 192 858 192" class="link"/>

  <rect x="858" y="258" width="310" height="143" rx="10" class="box"/>
  <text x="878" y="287" class="section">PERSISTENCE</text>
  <text x="878" y="315" class="label">data/db.json</text>
  <text x="878" y="338" class="small">products · orders · customers · settlements</text>
  <text x="878" y="360" class="small">IDs · auditLog</text>
  <text x="878" y="384" class="small">store.read() → memory → store.write()</text>
  <path d="M535 521 H826 V340 H858" class="flow"/>
  <circle cx="826" cy="448" r="12" class="step"/><text x="826" y="452" class="stepText">7</text>

  <!-- invoice endpoint and ticket distinction -->
  <rect x="858" y="449" width="310" height="124" rx="10" fill="#fff" stroke="#e11d48" stroke-width="1.5"/>
  <text x="878" y="478" class="section">PRINTABLE INVOICE</text>
  <text x="878" y="505" class="label">server.js → invoice.render(order)</text>
  <text x="878" y="528" class="small">orders.get() reads saved order; invoice.js</text>
  <text x="878" y="550" class="small">uses pricing.js for checkout-matched figures</text>
  <path d="M818 520 H840 V511 H858" class="link"/>
  <path d="M858 354 C836 354 843 535 818 535" class="link"/>

  <!-- other modules and route to data references -->
  <rect x="28" y="603" width="790" height="157" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="46" y="630" class="section">ORDER FLOW KEY</text>
  <circle cx="62" cy="657" r="12" class="step"/><text x="62" y="661" class="stepText">1</text><text x="82" y="661" class="small">UI submits cart</text>
  <circle cx="230" cy="657" r="12" class="step"/><text x="230" y="661" class="stepText">2</text><text x="250" y="661" class="small">server routes request</text>
  <circle cx="450" cy="657" r="12" class="step"/><text x="450" y="661" class="stepText">3</text><text x="470" y="661" class="small">orders route resolves product lines</text>
  <circle cx="62" cy="695" r="12" class="step"/><text x="62" y="699" class="stepText">4</text><text x="82" y="699" class="small">inventory check</text>
  <circle cx="230" cy="695" r="12" class="step"/><text x="230" y="699" class="stepText">5</text><text x="250" y="699" class="small">pricing + coupon + GST; optional Khata</text>
  <circle cx="535" cy="695" r="12" class="step"/><text x="535" y="699" class="stepText">6</text><text x="555" y="699" class="small">reserve stock; build order &amp; audit</text>
  <circle cx="62" cy="733" r="12" class="step"/><text x="62" y="737" class="stepText">7</text><text x="82" y="737" class="small">store.write() persists JSON</text>

  <rect x="858" y="621" width="310" height="112" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <text x="878" y="647" class="section">LEGEND</text>
  <rect x="878" y="661" width="20" height="16" rx="3" class="ticket"/><text x="907" y="674" class="small">Ticket focus: lib/invoice.js</text>
  <rect x="878" y="686" width="20" height="16" rx="3" class="tax"/><text x="907" y="699" class="small">Checkout GST dependency: lib/tax.js</text>
  <path d="M878 720 H900" class="flow"/><text x="910" y="724" class="small">Numbered order flow</text>
</svg>
